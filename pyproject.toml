[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-kernel"
version = "0.4.0rc2"
description = "面向多智能体协调下有害交互的因果审计及可控防御内核。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Xinyuan" }]
keywords = [
  "multi-agent",
  "causal-audit",
  "collusion",
  "activation",
  "ai-safety",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["packaging>=24,<27"]

[project.urls]
Homepage = "https://github.com/Xinyuan20061/WARDEN"
Repository = "https://github.com/Xinyuan20061/WARDEN"
Issues = "https://github.com/Xinyuan20061/WARDEN/issues"

[project.optional-dependencies]
research = ["concept-erasure==0.2.4"]
api = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]
probe = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
warden = "warden.interface.cli:main"

[tool.setuptools.packages.find]
include = ["warden", "warden.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
